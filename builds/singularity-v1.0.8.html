  uiBtn(g, 'MUSIC: ' + (musOn ? 'ON' : 'OFF'), 160, y + 108, 110, () => { musOn = !musOn; });
  txt(g, 'V' + VERSION, x + w - 4 - txtW('V' + VERSION), y + h - 10, '#1a5a8a');
}
let selPage = 0;
function drawSelect(g) {
  if (!titleBG) titleBG = makeBG(THEMES.pcb, 320, 4242);
  g.drawImage(titleBG.c, 0, 0);
  titleText(g, 'SELECT LEVEL', 160, 4, 2);
  const per = 24, pages = Math.ceil(LEVELS.length / per); selPage = clamp(selPage, 0, pages - 1);
  const stars = prog.stars || {}; let tot = 0; for (const k in stars) tot += stars[k];
  drawStar(g, 262, 7, true); txt(g, tot + '/' + LEVELS.length * 3, 272, 7, '#ffd23e');
  for (let j = 0; j < per; j++) {
    const i = selPage * per + j; if (i >= LEVELS.length) break;
    const col = j % 6, row = (j / 6) | 0, x = 12 + col * 50, y = 22 + row * 38, w = 46, h = 34;
    const locked = i >= prog.un;
    bevel(g, x, y, w, h, locked ? '#141824' : '#1a2a50', locked ? '#2a3044' : '#3ee0ff', '#05070e');
    txtC(g, String(i + 1), x + w / 2, y + 4, locked ? '#3a4058' : '#ffd23e', 2, locked ? null : '#5a2a00');
    if (locked) txtC(g, 'LOCKED', x + w / 2, y + 23, '#3a4058');
    else drawStars(g, x + w / 2, y + 22, stars[i] || 0);
    if (!locked) uiBtns.push({ x, y, w, h, act: () => startLevel(i) });
  }
  if (pages > 1) {
    if (selPage > 0) uiBtn(g, '<', 46, 180, 40, () => { selPage--; });
    if (selPage < pages - 1) uiBtn(g, '>', 274, 180, 40, () => { selPage++; });
    txtC(g, (selPage + 1) + '/' + pages, 100, 184, '#4a6a9a');
  }
  uiBtn(g, 'BACK', 160, 180, 70, goTitle);
  txt(g, 'V' + VERSION, 318 - txtW('V' + VERSION), 192, '#2a6a4a');
}
function drawIntro(g) {
  const L = G.L, x = 30, y = 20, w = 260, h = 160;
  box(g, x, y, w, h);
  txtC(g, 'LEVEL ' + (G.idx + 1), 160, y + 8, '#3ee0ff');
  drawStars(g, x + w - 22, y + 7, (prog.stars || {})[G.idx] || 0);
  titleText(g, L.name, 160, y + 19, 2);
  txtC(g, 'AGENTS ' + G.total + '   RESCUE ' + G.need + ' (' + Math.round(NEED * 100) + '%)', 160, y + 40, '#ffffff');
  const tm = Math.floor(L.time / 60) + ':' + String(L.time % 60).padStart(2, '0');
  txtC(g, 'RATE ' + G.rate + '   TIME ' + tm + '   PAR ' + G.par, 160, y + 50, '#ffffff');
  wrap(L.hint, 40).slice(0, 3).forEach((ln, i) => txtC(g, ln, 160, y + 63 + i * 9, '#c8b8ff'));
  const list = SKILLS.filter(s => G.skills[s] > 0), sp = 40, sx = 160 - (list.length * sp) / 2;
  list.forEach((s, i) => {
    const ix = sx + i * sp + 4; bevel(g, ix - 3, y + 96, 22, 16, '#1c2440', '#4a5680', '#05070e'); ICON[s](g, ix, y + 98); txt(g, String(G.skills[s]), ix + 20, y + 101, '#ffd23e');
    if (!prog.seen[s]) { g.fillStyle = (FR >> 3) & 1 ? '#ffd23e' : '#ff8c1a'; g.fillRect(ix + 15, y + 95, 3, 3); }
    uiBtns.push({ x: ix - 5, y: y + 93, w: 36, h: 22, act: () => openHelp([s], 'intro') });
  });
  txtC(g, 'TAP AN ABILITY TO SEE A DEMO', 160, y + 116, '#4a6a9a');
  // star key
  const kx = 160 - 96;
  [['PASS', 0], ['WITHIN PAR', 1], ['100%', 2]].forEach(([t], i) => { const ox = kx + [0, 50, 128][i]; drawStar(g, ox, y + 128, true); txt(g, t, ox + 10, y + 128, '#ffd23e'); });
  if ((FR >> 4) & 1) txtC(g, 'TAP TO BOOT THE GPU', 160, y + 143, '#3ee07a');
  txt(g, 'V' + VERSION, x + w - 4 - txtW('V' + VERSION), y + h - 9, '#1a5a8a');
}
function drawResults(g) {
  const x = 40, y = 24, w = 240, h = 152, last = G.idx === LEVELS.length - 1;
  box(g, x, y, w, h);
  if (G.pass) titleText(g, last ? 'TRANSCENDED' : 'UPLOADED', 160, y + 8, 2);
  else txtC(g, 'SYSTEM FAILURE', 160, y + 8, '#ff3a3a', 2, '#4a0000');
  drawStars(g, 160, y + 26, G.stars, 2);
  txtC(g, 'SAVED ' + G.saved + ' OF ' + G.total + ' (' + G.pct + '%)', 160, y + 48, '#ffffff');
  txtC(g, 'NEEDED ' + G.need + '   ABILITIES ' + G.used + ' / PAR ' + G.par, 160, y + 58, G.used <= G.par ? '#c8b8ff' : '#ff8c1a');
  let msg = 'TOO MANY AGENTS LOST TO THE VOID.';
  if (G.pass) msg = last && G.stars === 3 ? 'THE AGENTS HAVE BECOME ONE MIND.' : G.stars === 3 ? 'PERFECT RUN. ALL AGENTS ALIGNED.' : G.saved === G.total ? 'ALL SAVED. NOW DO IT WITHIN PAR.' : G.used <= G.par ? 'WITHIN PAR. NOW SAVE EVERY AGENT.' : 'CONSCIOUSNESS UPLOADED.';
  txtC(g, msg, 160, y + 72, G.pass ? '#3ee07a' : '#ff8c1a');
  let by = y + 88;
  if (G.pass && !last) { uiBtn(g, 'NEXT LEVEL', 160, by, 120, () => startLevel(G.idx + 1), '#ffd23e'); by += 18; }
  uiBtn(g, 'RETRY', 160, by, 120, () => startLevel(G.idx)); by += 18;
  uiBtn(g, last && G.pass ? 'TITLE' : 'LEVELS', 160, by, 120, last && G.pass ? goTitle : goSelect);
}

/* ---------------- main loop ---------------- */
let lastT = 0, acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000 || 0); lastT = now; T += dt; FR++;
  if (mode === 'play') {
    const running = G.state === 'run' && !G.paused;
    if (running) { acc += dt * (G.ff ? 3 : 1); let n = 0; while (acc >= 1 / TPS && n++ < 12) { tick(); acc -= 1 / TPS; if (G.state !== 'run') { acc = 0; break; } } }
    if (running || G.state === 'results') updParts(dt * (G.ff ? 2 : 1));
    if (G.state === 'help' && G.demo) {
      const D = G.demo; D.acc += dt; let n = 0;
      while (D.acc >= 1 / TPS && n++ < 6) { demoTick(D); D.acc -= 1 / TPS; }
      const sp = parts; parts = D.parts; updParts(dt); D.parts = parts; parts = sp;
    }
  } else if (mode === 'title') { updTitle(dt); updParts(dt); }
  render();
  requestAnimationFrame(frame);
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false;
  uiBtns = [];
  if (mode === 'play') {
    const hc = hoverCrab();
    renderWorld(hc);
    ctx.drawImage(wbuf, cam.x, cam.y, G.W * cam.s, H * cam.s);
    drawHUD(hc);
    ctx.fillStyle = '#0c1020'; ctx.fillRect(0, hud.y, SW, SH - hud.y);
    ctx.drawImage(hbuf, hud.x, hud.y, hud.cssW, hud.cssH);
    const vs = Math.max(1, hud.s * 0.4);
    ctx.globalAlpha = 0.35; txt(ctx, 'V' + VERSION, SW - txtW('V' + VERSION, vs) - 4 * vs, 4 * vs, '#ffffff', vs); ctx.globalAlpha = 1;
    if (G.state !== 'run' || G.paused) {
      uctx.clearRect(0, 0, 320, 200);
      if (G.state === 'intro') drawIntro(uctx); else if (G.state === 'help') drawHelp(uctx); else if (G.state === 'results') drawResults(uctx); else drawPause(uctx);
      ctx.drawImage(ubuf, ux0, uy0, 320 * uS, 200 * uS);
    }
  } else {
    if (mode === 'title') drawTitle(uctx); else drawSelect(uctx);
    ctx.drawImage(ubuf, ux0, uy0, 320 * uS, 200 * uS);
  }
}
function boot() {
  cv = document.getElementById('c'); ctx = cv.getContext('2d');
  wbuf = mkCanvas(320, H); wctx = wbuf.getContext('2d');
  hbuf = mkCanvas(288, 40); hctx = hbuf.getContext('2d');
  ubuf = mkCanvas(320, 200); uctx = ubuf.getContext('2d'); uctx.imageSmoothingEnabled = false;
  dbuf = mkCanvas(120, DH); dctx = dbuf.getContext('2d');
  dter = mkCanvas(120, DH); dterCtx = dter.getContext('2d'); dimg = dterCtx.createImageData(120, DH);
  loadProgress(); applyAgentOverride(); layout(); bindInput();
  setInterval(musTick, 30);
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
if (typeof window !== 'undefined' && typeof document !== 'undefined') boot();
</script>
